name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo check --all-targets --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.82.2
        with:
          tool: cargo-audit@0.22.1
      - run: cargo audit

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.82.2
        with:
          tool: cargo-deny@0.19.0
      - run: cargo deny check

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@v1.74.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review

  zizmor:
    name: Analyze workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.82.2
        with:
          tool: zizmor@1.24.0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --config .github/zizmor.yml --min-severity medium .

  actions-lock:
    # Preserve the required status-check name configured in the repository ruleset.
    name: Pin actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install actions-lock
        env:
          ACTIONS_LOCK_VERSION: 0.2.0
          ACTIONS_LOCK_SHA256: 79ec84c191667fd935a277e6fd3662cf5d3669cccc9e99998731d8f306f373b6
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/actions-lock"
          curl -fsSL "https://github.com/github/gh-actions-lock/releases/download/v${ACTIONS_LOCK_VERSION}/linux-amd64" -o "${RUNNER_TEMP}/actions-lock/gh-actions-lock"
          echo "${ACTIONS_LOCK_SHA256}  ${RUNNER_TEMP}/actions-lock/gh-actions-lock" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/actions-lock/gh-actions-lock"
          echo "${RUNNER_TEMP}/actions-lock" >> "$GITHUB_PATH"
      - name: Verify all workflow dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh-actions-lock --verify
