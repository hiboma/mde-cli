name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  release:
    name: Verify and publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: mde-cli-*
          path: artifacts
          merge-multiple: true

      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in \
            mde-cli-x86_64-unknown-linux-musl.tar.gz \
            mde-cli-aarch64-unknown-linux-musl.tar.gz \
            mde-cli-x86_64-apple-darwin.tar.gz \
            mde-cli-aarch64-apple-darwin.tar.gz \
            mde-cli-sbom.cdx.json; do
            gh attestation verify "artifacts/$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --signer-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
              --deny-self-hosted-runners
          done
          test "$(find artifacts -type f | wc -l)" -eq 5

      - name: Create draft and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft
          gh release edit "$REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
